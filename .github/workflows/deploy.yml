# .github/workflows/deploy.yml
name: Auto Deploy JJU Project

on:
  push:
    branches:
      - main  # triggers when you push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Check deployment secrets
      id: secrets-check
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
      run: |
        if [ -n "$SSH_KEY" ] && [ -n "$SERVER_IP" ] && [ -n "$SERVER_USER" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "⚠️  Deployment secrets (SERVER_IP, SERVER_USER, SSH_KEY) are not configured."
          echo "    Skipping SSH deploy step. Configure the secrets to enable auto-deployment."
        fi

    - name: Deploy to DigitalOcean Server
      if: steps.secrets-check.outputs.available == 'true'
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          echo "Connected to server"
          
          cd /var/www/JJU
          git reset --hard
          git pull origin main

          echo "Deploying Backend"
          cd backend
          npm install
          pm2 restart all || pm2 start index.js --name backend

          echo "Deploying Frontend"
          cd ../frontend
          npm install
          NODE_OPTIONS="--max-old-space-size=4096" npm run build

          rm -rf /var/www/html/*
          cp -r dist/* /var/www/html/

          echo "Deployment Finished"
